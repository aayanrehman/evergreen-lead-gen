<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>Link builder</title>
<style>body{font:16px/1.5 system-ui;max-width:560px;margin:40px auto;padding:0 16px;background:#FAFAF7;color:#14201B}label{display:block;margin:14px 0 4px;font-weight:600}input,select{width:100%;font:inherit;padding:10px;border:1px solid #ccc;border-radius:6px}output{display:block;word-break:break-all;background:#EEEDE6;padding:12px;border-radius:6px;margin-top:20px}button{margin-top:10px;padding:10px 16px;font:inherit;background:#1F4A3C;color:#fff;border:0;border-radius:6px;cursor:pointer}</style>
<h1>Personalized link</h1>
<label>First name<input id=first></label><label>Company<input id=company></label>
<label>Their front door<select id=type><option value="">Generic (webinars and workshops)</option><option value=webinar>Webinar</option><option value=workshop>Workshop</option><option value=guide>Free guide</option><option value=none>None yet</option></select></label>
<label>Its title (skip for none)<input id=front placeholder="Making the Most of Your College Visit"></label>
<label>Area (with preposition)<input id=area placeholder="in Fairfield County"></label>
<label><input type=checkbox id=clean style="width:auto"> Hide scene counter (recording)</label>
<output id=out></output><button id=cp>Copy</button>
<script>const f=["first","company","type","front","area"],$=i=>document.getElementById(i);
function u(){const p=new URLSearchParams();f.forEach(k=>$(k).value.trim()&&p.set(k,$(k).value.trim()));if($("clean").checked)p.set("clean","1");const s=p.toString();$("out").textContent=location.origin+"/"+(s?"?"+s:"")}
document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",u));u();$("cp").onclick=()=>{navigator.clipboard.writeText($("out").textContent);$("cp").textContent="Copied"}</script>
